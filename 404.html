<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#fff; --text:#15181d; --dim:#5a6472; --accent:#1457c7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1020; --text:#e9edf5; --dim:#9aa7bd; --accent:#6ea8ff; }
  }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--text); text-align:center; padding:16px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size:clamp(2.5rem,12vw,4rem); margin:0; letter-spacing:-0.03em; }
  p { color:var(--dim); margin:8px 0 24px; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>That page does not exist.</p>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
